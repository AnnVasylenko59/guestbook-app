# 1. Системні налаштування Spring Boot та вбудованого сервера
spring.main.web-application-type=servlet
server.port=8080
spring.application.name=guestbook-app

# 2. Thymeleaf (JSP-налаштування видалено; префікс/суфікс за замовчуванням: templates/*.html)
spring.thymeleaf.cache=false

# 3. Локалізація: messages.properties (uk), messages_en.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# якщо мова браузера не підтримується — беремо messages.properties (uk), а не мову ОС
spring.messages.fallback-to-system-locale=false

# 4. ВЛАСНІ (КАСТОМНІ) ПАРАМЕТРИ ДОДАТКА ЛР4
app.catalog.default-page-size=15
app.catalog.welcome-banner=Лабораторна робота 4: Spring Core & Boot активна!
app.catalog.feature-enabled=true

# 5. Налаштування пошти (Gmail SMTP) та FreeMarker для листів =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lisavles2005@gmail.com
spring.mail.password=ghiteboacfszksck
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Адресат і відправник листа про нову книгу
app.mail.to=lisavles2005@gmail.com
app.mail.from=lisavles2005@gmail.com

# FreeMarker налаштування для шаблонів листів
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8